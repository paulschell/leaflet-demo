<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points of Interest Mauritius</title>
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="shortcut icon" href="#">
    <style>
        .legend {
          background: white;
          padding: 8px 10px;
          border-radius: 5px;
          box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
          font: 13px/20px Arial, sans-serif;
        }
        .legend summary {
          font-size: 14px;
        }
        .legend[open] summary {
          margin-bottom: 4px;
        }
        .legend i {
          display: inline-block;
          width: 12px;
          height: 12px;
          margin-right: 6px;
          border: 1.5px solid white;
          border-radius: 50%;
          vertical-align: -2px;
          box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3);
        }
        .legend i.line {
          height: 0;
          border: none;
          border-top: 3px solid;
          border-radius: 0;
          box-shadow: none;
          vertical-align: 4px;
        }

        /* Leaflet 2.0-alpha only sets min-width/max-width on the popup content,
           so without a width it shrinks to its longest word */
        .leaflet-popup-content {
          width: max-content;
          margin: 12px 16px;
        }
        .poi-popup {
          font: 13px/1.45 Arial, sans-serif;
          color: #222;
        }
        .poi-badge {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 11px;
          font-weight: bold;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: #555;
        }
        .poi-badge i {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3);
        }
        .poi-badge i.line {
          width: 14px;
          height: 0;
          border-top: 3px solid;
          border-radius: 0;
          box-shadow: none;
        }
        .poi-title {
          margin: 4px 0 0;
          font-size: 15px;
          font-weight: bold;
          line-height: 1.3;
          color: #111;
        }
        .poi-subtitle {
          color: #555;
        }
        .poi-rows {
          display: grid;
          grid-template-columns: auto 1fr;
          gap: 3px 12px;
          margin: 10px 0 0;
        }
        .poi-rows dt {
          color: #666;
        }
        .poi-rows dd {
          margin: 0;
          overflow-wrap: anywhere;
        }
        .poi-tags {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
        }
        .poi-tags span {
          padding: 0 7px;
          border-radius: 10px;
          background: #eef1f5;
          font-size: 12px;
        }
        .poi-warning {
          margin-top: 10px;
          padding: 6px 8px;
          border-left: 4px solid #d4c400;
          background: #fffbe0;
        }
        .poi-split {
          display: flex;
          height: 6px;
          margin-top: 4px;
          border-radius: 3px;
          overflow: hidden;
          background: #E69F00;
        }
        .poi-split span,
        .poi-rows i.male {
          background: #0072B2;
        }
        .poi-rows i.female {
          background: #E69F00;
        }
        .poi-rows i {
          display: inline-block;
          width: 8px;
          height: 8px;
          margin-right: 5px;
          border-radius: 2px;
        }
        .poi-footer {
          margin-top: 10px;
          padding-top: 6px;
          border-top: 1px solid #eee;
          font-size: 12px;
          color: #666;
        }
    </style>
</head>
<body>
  <header class="site-header">
    <h1 class="sr-only">Points of Interest Mauritius</h1>
    <a class="site-title" href="index.html">Leaflet Demo · Mauritius</a>
    <nav aria-label="Pages">
      <a href="index.html">Map</a>
      <a href="pois.html" aria-current="page">POIs</a>
      <a href="climate.html">Climate &amp; Sea Level</a>
      <a href="wind/wind.html">Wind &amp; Currents</a>
    </nav>
  </header>
  <main id="map" aria-label="Points of Interest Mauritius"></main>
  <script type="importmap">
      {
          "imports": {
              "leaflet": "./node_modules/leaflet/dist/leaflet.js"
          }
      }
  </script>
  <script type="module">
      import {Map, Control, DomUtil, DomEvent, TileLayer, LayerGroup, GeoJSON, CircleMarker} from 'leaflet';

    // Leaflet GeoJSON layers
    let primarySchoolsLayer = new LayerGroup();
    let shoppingmallLayer = new LayerGroup();
    let busstopLayer = new LayerGroup();
    let postOfficeLayer = new LayerGroup();
    let hospitalClinicsLayer = new LayerGroup();
    let pharmaciesLayer = new LayerGroup();
    let socialWelfareCentresLayer = new LayerGroup();
    let policeStationsLayer = new LayerGroup();
    let atmsLayer = new LayerGroup();
    let speedCamerasLayer = new LayerGroup();
    let dangerousBathingLayer = new LayerGroup();
    let busRoutesLayer = new LayerGroup();
    let districtsLayer = new LayerGroup();

    const map = new Map('map').setView([-20.27, 57.57], 10); // Adjust center/zoom

    // Lines and polygons get their own pane below the points, so they never cover a marker
    map.createPane('shapes').style.zIndex = 350;

    var osm = new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);  // Default base layer

    var stadiaAlidadeSmooth = new TileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.{ext}', {
      minZoom: 0,
      maxZoom: 20,
      attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      ext: 'png'
    });

    var esriWorldImagery = new TileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });

    // Add layer control for base layers and overlays (POI categories)
    // @see: https://leaflet-extras.github.io/leaflet-providers/preview/
    var baseLayers = {
      "OpenStreetMap": osm,
      "Stadia": stadiaAlidadeSmooth,
      "Esri Satellite": esriWorldImagery
    };

    // Marker colors per category (Okabe-Ito palette, colorblind safe,
    // extended with colors from Paul Tol's muted palette)
    const colors = {
        "Primary Schools": '#E69F00',
        "Shopping Malls": '#CC79A7',
        "Busstops": '#56B4E9',
        "Postoffices": '#0072B2',
        "Hospitals & Clinics": '#D55E00',
        "Pharmacies": '#009E73',
        "Social Welfare Centres": '#332288',
        "Police Stations": '#000000',
        "ATMs": '#999933',
        "Speed Cameras": '#882255',
        "Dangerous Bathing": '#F0E442',
    };

    // Styles of the line and polygon categories
    const shapeStyles = {
        "Bus Routes": { color: '#0072B2', weight: 3, opacity: 0.6 },
        "Districts": { color: '#444', weight: 2, dashArray: '6 4', fillColor: '#444', fillOpacity: 0.05 },
    };

    function pointStyle(color) {
      return { radius: 6, fillColor: color, color: '#fff', weight: 1.5, opacity: 1, fillOpacity: 0.9 };
    }

    var overlays = {
        "Primary Schools": primarySchoolsLayer,
        "Shopping Malls": shoppingmallLayer,
        "Busstops": busstopLayer,
        "Postoffices": postOfficeLayer,
        "Hospitals & Clinics": hospitalClinicsLayer,
        "Pharmacies": pharmaciesLayer,
        "Social Welfare Centres": socialWelfareCentresLayer,
        "Police Stations": policeStationsLayer,
        "ATMs": atmsLayer,
        "Speed Cameras": speedCamerasLayer,
        "Dangerous Bathing": dangerousBathingLayer,
        "Bus Routes": busRoutesLayer,
        "Districts": districtsLayer,
    };

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Clean up a text value from the open data exports: broken characters, extra
    // whitespace, spaces before commas and texts written in capital letters only
    function tidy(value) {
      const text = String(value)
        .replace(/(\p{L})�(\p{L})/gu, "$1'$2")
        .replace(/�/g, '')
        .replace(/\s+/g, ' ')
        .replace(/\s*,\s*/g, ', ')
        .replace(/^[\s,]+|[\s,]+$/g, '');

      if (/\p{Ll}/u.test(text) || !/\p{Lu}{4,}/u.test(text)) return text;
      return text.toLowerCase().replace(/(^|[\s,(\-\/'.])(\p{L})/gu, (match, before, letter) => before + letter.toUpperCase());
    }

    function formatNumber(value, digits = 0) {
      return value.toLocaleString('en', { maximumFractionDigits: digits });
    }

    // Phone numbers as tel: links with the country code +230 of Mauritius, e.g. "+230 242 3020".
    // Several numbers may be separated by "/" or ","; short numbers such as hotlines stay as they are.
    function phoneLinks(value) {
      const numbers = [];
      for (const part of String(value).split(/[\/,]/)) {
        let digits = part.replace(/\D/g, '').replace(/^230(?=\d{7,8}$)/, '');
        const previous = numbers.at(-1) ?? '';
        // "627 9340/1" or "266 2238 / 39": the next number only lists the digits that change
        if (digits.length > 0 && digits.length <= 2 && previous.length >= 7) {
          digits = previous.slice(0, -digits.length) + digits;
        }
        if (digits && !numbers.includes(digits)) numbers.push(digits);
      }

      return numbers.map(local => {
        if (!/^\d{7,8}$/.test(local)) return `<a href="tel:${local}">${local}</a>`;
        // Landlines have 7 digits (123 4567), mobile numbers 8 (5123 4567)
        const formatted = local.replace(/^(\d{3,4})(\d{4})$/, '$1 $2');
        return `<a href="tel:+230${local}">+230 ${formatted}</a>`;
      }).join(', ');
    }

    function emailLink(value) {
      return `<a href="mailto:${escapeHtml(value)}">${escapeHtml(value)}</a>`;
    }

    function websiteLink(value) {
      const url = /^https?:\/\//.test(value) ? value : `https://${value}`;
      const label = value.replace(/^(https?:\/\/)?(www\.)?|\/$/g, '');
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
    }

    // Split free text such as "ROYAL ROAD<br>Tel: 248-8157<br>Fax: ...<br>Email: ..." into popup rows (without fax)
    function contactRows(value) {
      const address = [];
      const rows = [];
      const notes = [];
      // Lines are separated by <br>, but some entries list "Tel: … Fax: … Email: …" in one line.
      // Tabs separate parts of an address or several numbers.
      const lines = String(value ?? '')
        .split(/<br\s*\/?>|[\s,]+(?=(?:tel|fax|phone|e-?mail|medium)(?![a-z]))/i)
        .map(line => tidy(line.replace(/:\s*\t+/g, ': ').replace(/\t/g, ', ')))
        .filter(Boolean);

      for (const line of lines) {
        if (/^(https?:\/\/|www\.)/i.test(line)) {
          rows.push(['Website', websiteLink(line)]);
          continue;
        }

        // "Tel: 123", "Tel No. 123", "Fax123" or any other "Label: value"
        const labeled = line.match(/^(tel|phone|fax|e-?mail|emali)(?![a-z])\.?\s*(?:no\.?)?\s*:?\s*(.+)$/i)
          ?? line.match(/^([\p{L} .]{2,40}?)\s*:\s*(.+)$/u);
        const label = labeled?.[1].trim().toLowerCase();
        const text = labeled?.[2].trim();

        if (label === 'address' || label === 'city') address.push(text);
        else if (label === 'tel' || label === 'phone') rows.push(['Phone', phoneLinks(text)]);
        else if (label === 'fax') continue;
        else if (['email', 'e-mail', 'emali'].includes(label)) rows.push(['Email', emailLink(text)]);
        else if (labeled) rows.push([escapeHtml(labeled[1].trim()), /^[+\d()\s\-\/]+$/.test(text) ? phoneLinks(text) : escapeHtml(text)]);
        else if (/^[+\d()\s\-\/]{7,}$/.test(line)) rows.push(['Phone', phoneLinks(line)]);
        else if (rows.length) notes.push(line);
        else address.push(line);
      }

      if (address.length) rows.unshift(['Address', escapeHtml(address.join(', '))]);
      if (notes.length) rows.push(['Note', escapeHtml(notes.join(', ').replace(/^ZEP$/, 'ZEP (priority education zone)'))]);
      return rows;
    }

    function tags(values) {
      return `<div class="poi-tags">${values.map(value => `<span>${escapeHtml(value)}</span>`).join('')}</div>`;
    }

    // Popup markup shared by all categories: badge with the category color, title,
    // subtitle, label/value rows, extra HTML and the coordinates for points
    function popupHtml(category, feature, { title, subtitle, rows = [], extra = '' }) {
      const color = colors[category] ?? shapeStyles[category].color;
      const swatch = colors[category]
        ? `<i style="background:${color}"></i>`
        : `<i class="line" style="border-top-color:${color}"></i>`;
      const visibleRows = rows.filter(([, value]) => value);

      let footer = '';
      if (feature.geometry.type === 'Point') {
        const [lng, lat] = feature.geometry.coordinates;
        const coordinates = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        footer = `<div class="poi-footer">${coordinates} · <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=18/${lat}/${lng}" target="_blank" rel="noopener">OpenStreetMap</a></div>`;
      }

      return `<div class="poi-popup">
        <div class="poi-badge">${swatch}${escapeHtml(category)}</div>
        ${title ? `<div class="poi-title">${escapeHtml(title)}</div>` : ''}
        ${subtitle ? `<div class="poi-subtitle">${escapeHtml(subtitle)}</div>` : ''}
        ${visibleRows.length ? `<dl class="poi-rows">${visibleRows.map(([label, value]) => `<dt>${label}</dt><dd>${value}</dd>`).join('')}</dl>` : ''}
        ${extra}
        ${footer}
      </div>`;
    }

    const yesNo = value => value === 'yes' ? 'Yes' : value === 'no' ? 'No' : value && escapeHtml(value);
    const text = value => value != null && value !== '' ? escapeHtml(tidy(value)) : '';

    // Popup content per category: title, subtitle and rows from the feature properties
    const popups = {
      "Primary Schools": p => ({ title: tidy(p.name), rows: contactRows(p.description) }),
      "Shopping Malls": p => ({
        title: tidy(p.name),
        subtitle: p.district,
        rows: [
          ['Address', text(p.address)],
          ['Phone', p.contact_nu && phoneLinks(p.contact_nu)],
          ['Website', p.website && websiteLink(p.website)],
        ],
      }),
      "Busstops": p => ({
        title: p.name ? tidy(p.name) : 'Bus stop',
        subtitle: p.network,
        rows: [
          ['Operator', text(p.operator)],
          ['Street', text(p.addr_stree)],
          ['Shelter', yesNo(p.shelter)],
          ['Bench', yesNo(p.bench)],
          ['Wheelchair', yesNo(p.wheelchair)],
          ['OSM node', p.full_id && `<a href="https://www.openstreetmap.org/node/${p.full_id.slice(1)}" target="_blank" rel="noopener">${p.full_id.slice(1)}</a>`],
        ],
      }),
      // post_offices.json has no attributes, so the popup shows only the coordinates
      "Postoffices": () => ({ title: 'Post office' }),
      "Hospitals & Clinics": p => ({
        title: tidy(p.name),
        subtitle: { Hospitals: 'Hospital', Clinics: 'Clinic', Mediclinics: 'Mediclinic' }[p.type] ?? p.type,
        rows: contactRows(p.address),
      }),
      "Pharmacies": p => ({ title: tidy(p.name), rows: [['Address', text(p.address)], ['Phone', p.phone && phoneLinks(p.phone)]] }),
      "Social Welfare Centres": p => ({ title: tidy(p.name).replace(/\bSWC$/, 'Social Welfare Centre') }),
      "Police Stations": p => ({ title: tidy(p.name), rows: [['Phone', p.phone && phoneLinks(p.phone)]] }),
      "ATMs": p => {
        const services = [...new Set((p.services ?? '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean))];
        return {
          title: tidy(p.name),
          subtitle: p.bank,
          rows: [['Address', text(p.address)], ['Services', services.length && tags(services)]],
        };
      },
      "Speed Cameras": p => ({
        title: tidy(p.location),
        subtitle: p.name,
        rows: [['Code', text(p.code)], ['Region', text(p.region)]],
      }),
      "Dangerous Bathing": p => ({
        title: tidy(p.name).replace(/\s*Dangerous Bathing$/i, ''),
        subtitle: p.district,
        extra: '<div class="poi-warning">⚠ Marked as dangerous for bathing</div>',
      }),
      "Bus Routes": (p, layer) => {
        // A LineString has a list of points, a MultiLineString a list of lines
        const latlngs = layer.getLatLngs();
        const lines = Array.isArray(latlngs[0]) ? latlngs : [latlngs];
        const meters = lines.reduce((sum, line) =>
          sum + line.slice(1).reduce((length, point, i) => length + map.distance(line[i], point), 0), 0);
        return { title: 'Bus route', rows: [['Length', `${formatNumber(meters / 1000, 1)} km`]] };
      },
      "Districts": p => {
        const male = p.male / p.population * 100;
        return {
          title: p.name,
          rows: [
            ['Area', `${formatNumber(p.area_km2)} km²`],
            ['Population', formatNumber(p.population)],
            ['Density', `${formatNumber(p.population / p.area_km2)} per km²`],
            ['<i class="male"></i>Male', `${formatNumber(p.male)} (${formatNumber(male, 1)}%)`],
            ['<i class="female"></i>Female', `${formatNumber(p.female)} (${formatNumber(100 - male, 1)}%)`],
          ],
          extra: `<div class="poi-split" title="Male / female share"><span style="width:${male.toFixed(1)}%"></span></div>`,
        };
      },
    };

    function geometryCollectionToFeatures(gc) {
        return gc.geometries.map((geom, idx) => ({
          type: "Feature",
          id: idx + 1,                     // optional ID
          properties: {                    // you can enrich later
            index: idx + 1
          },
          geometry: geom
        }));
    };

    // mu_pharmacies.json is a plain list with coordinates
    function pharmaciesToFeatures(pharmacies) {
      return pharmacies.map(pharmacy => ({
        type: "Feature",
        properties: { name: pharmacy.Name_of_Pharmacy, address: pharmacy.Address, phone: pharmacy.Contact_Number },
        geometry: { type: "Point", coordinates: [pharmacy.Longitude, pharmacy.Latitude] },
      }));
    }

    // GeoJSON layer options for points drawn as colored circles
    function points(color) {
      return { pointToLayer: (feature, latlng) => new CircleMarker(latlng, pointStyle(color)) };
    }

    // GeoJSON layer options for lines and polygons in the pane below the points
    function shapes(style) {
      return { pane: 'shapes', style };
    }

    // Narrower popups on small screens, kept below the zoom and layer controls when the map pans
    function popupOptions() {
      return { minWidth: 200, maxWidth: Math.min(320, map.getSize().x - 80), autoPanPaddingTopLeft: [10, 90] };
    }

    // Load a GeoJSON file into the layer group of a category
    async function loadGeoJSON(url, category, layerOptions, toGeoJSON = data => data) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const geojson = toGeoJSON(await response.json());

        new GeoJSON(geojson, {
          ...layerOptions,
          onEachFeature: (feature, layer) => {
            const content = popups[category](feature.properties || {}, layer);
            layer.bindPopup(popupHtml(category, feature, content), popupOptions());
          },
        }).addTo(overlays[category]);
      } catch (error) {
        console.error(`Error loading ${url}:`, error);
      }
    }

    loadGeoJSON('./data/primary_schools.geojson', 'Primary Schools', points(colors['Primary Schools']));
    loadGeoJSON('./data/shoppingmall.geojson', 'Shopping Malls', points(colors['Shopping Malls']));
    loadGeoJSON('./data/busstops.geojson', 'Busstops', points(colors['Busstops']));
    loadGeoJSON('./data/post_offices.json', 'Postoffices', points(colors['Postoffices']), geometryCollectionToFeatures);
    loadGeoJSON('./data/hospitals_clinics.json', 'Hospitals & Clinics', points(colors['Hospitals & Clinics']));
    loadGeoJSON('./data/mu_pharmacies.json', 'Pharmacies', points(colors['Pharmacies']), pharmaciesToFeatures);
    loadGeoJSON('./data/social_welfare_centres.geojson', 'Social Welfare Centres', points(colors['Social Welfare Centres']));
    loadGeoJSON('./data/police_stations.geojson', 'Police Stations', points(colors['Police Stations']));
    loadGeoJSON('./data/atms.geojson', 'ATMs', points(colors['ATMs']));
    loadGeoJSON('./data/speed_cameras.geojson', 'Speed Cameras', points(colors['Speed Cameras']));
    loadGeoJSON('./data/dangerous_bathing.geojson', 'Dangerous Bathing', points(colors['Dangerous Bathing']));
    loadGeoJSON('./data/bus_routes.geojson', 'Bus Routes', shapes(shapeStyles['Bus Routes']));
    loadGeoJSON('./data/districts.geojson', 'Districts', shapes(shapeStyles['Districts']));

    // new Control.Layers(baseLayers).addTo(map);
    new Control.Layers(baseLayers, overlays).addTo(map);

    // Legend with the category colors and line styles, collapsed on small screens
    const legend = new Control({ position: 'bottomright' });
    legend.onAdd = function () {
        const details = DomUtil.create('details', 'legend map-panel');
        details.open = !matchMedia('(max-width: 600px)').matches;
        DomEvent.disableClickPropagation(details);
        DomEvent.disableScrollPropagation(details);
        const pointItems = Object.entries(colors)
          .map(([name, color]) => `<i style="background:${color}"></i>${name}`);
        const shapeItems = Object.entries(shapeStyles)
          .map(([name, style]) => `<i class="line" style="border-top-color:${style.color};border-top-style:${style.dashArray ? 'dashed' : 'solid'}"></i>${name}`);
        details.innerHTML = '<summary>Legend</summary><div class="legend-items">'
          + [...pointItems, ...shapeItems].join('<br>') + '</div>';
        return details;
    };
    legend.addTo(map);
  </script>
</body>
</html>
