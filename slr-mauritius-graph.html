<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeresspiegelanstieg Mauritius + Graphen</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .legend,
        .info,
        .control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            line-height: 18px;
        }

        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
        }

        .control label,
        .control select {
            display: block;
            margin: 5px 0;
        }

        canvas {
            max-height: 180px;
        }

        .popup-content {
            max-width: 320px;
        }
    </style>
</head>

<body>
    <div id="map"></div>


    <script type="importmap">
        {
            "imports": {
                "leaflet": "./node_modules/leaflet/dist/leaflet.js"
            }
        }
    </script>
    <script type="module">
        import {Map, Control, DomUtil, TileLayer, GeoJSON} from 'leaflet';

        // Karte initialisieren
        const map = new Map('map').setView([-20.2, 57.55], 10);
        new TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // === HISTORISCHE & PROGNOSTIZIERTE DATEN ===
        // Beispieldaten: Messreihe und Zonen dienen der Illustration und sind nicht aus einer Quelle übernommen.
        // Die Projektionen orientieren sich an IPCC AR6, NASA Sea Level Projection Tool und World Bank CCKP.
        const historicalData = [
            { year: 1987, level: 0.0 },
            { year: 1990, level: 1.0 },
            { year: 1995, level: 2.6 },
            { year: 2000, level: 4.3 },
            { year: 2005, level: 6.1 },
            { year: 2010, level: 8.0 },
            { year: 2015, level: 11.4 },
            { year: 2020, level: 14.0 },
            { year: 2023, level: 15.2 }
        ];

        // rise.hoch (SSP5-8.5) sind die bisherigen Zonenwerte. rise.niedrig (SSP1-2.6) ist daraus abgeleitet:
        // Zonenwert × regionales Verhältnis (2050: 16/24, 2100: 28/49), auf ganze cm gerundet.
        const slrZones = {
            type: 'FeatureCollection',
            features: [
                {
                    type: 'Feature',
                    properties: {
                        area: 'Port Louis Hafen',
                        rise: { niedrig: { 2050: 16, 2100: 28 }, hoch: { 2050: 24, 2100: 49 } },
                        source: 'MMS / World Bank',
                        station: 'Port Louis Tide Gauge'
                    },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [[[57.49, -20.15], [57.51, -20.15], [57.51, -20.17], [57.49, -20.17], [57.49, -20.15]]]
                    }
                },
                {
                    type: 'Feature',
                    properties: {
                        area: 'Grand Baie',
                        rise: { niedrig: { 2050: 13, 2100: 23 }, hoch: { 2050: 20, 2100: 40 } },
                        source: 'IPCC AR6',
                        station: 'Regionale Projektion'
                    },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [[[57.58, -20.00], [57.60, -20.00], [57.60, -20.02], [57.58, -20.02], [57.58, -20.00]]]
                    }
                },
                {
                    type: 'Feature',
                    properties: {
                        area: 'Flic en Flac',
                        rise: { niedrig: { 2050: 11, 2100: 16 }, hoch: { 2050: 16, 2100: 28 } },
                        source: 'World Bank CCKP',
                        station: 'Küstenmodell'
                    },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [[[57.35, -20.28], [57.37, -20.28], [57.37, -20.30], [57.35, -20.30], [57.35, -20.28]]]
                    }
                }
            ]
        };

        // Risikostufe und Farbe aus dem Anstieg in cm
        function getRisk(rise) {
            if (rise < 20) return { label: 'Niedrig', color: '#a6d96a' };
            if (rise < 40) return { label: 'Mittel', color: '#fdae61' };
            return { label: 'Hoch', color: '#d7191c' };
        }

        // === Chart erstellen ===
        function createChart(ctx, zone, scenario) {
            const histYears = historicalData.map(d => d.year);
            const histLevels = historicalData.map(d => d.level);

            const proj2050 = zone.rise[scenario][2050];
            const proj2100 = zone.rise[scenario][2100];
            const ssp = scenario === 'niedrig' ? 'SSP1-2.6' : 'SSP5-8.5';

            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [...histYears, 2050, 2100],
                    datasets: [
                        {
                            label: 'Gemessen (Port Louis)',
                            data: [...histLevels, null, null],
                            borderColor: '#1f78b4',
                            backgroundColor: 'rgba(31, 120, 180, 0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 4
                        },
                        {
                            label: `Prognose 2050 (${ssp})`,
                            data: [null, null, null, null, null, null, null, null, null, proj2050, null],
                            borderColor: '#ff7f00',
                            borderDash: [5, 5],
                            pointRadius: 6,
                            pointBackgroundColor: '#ff7f00'
                        },
                        {
                            label: `Prognose 2100 (${ssp})`,
                            data: [null, null, null, null, null, null, null, null, null, null, proj2100],
                            borderColor: '#e31a1c',
                            borderDash: [5, 5],
                            pointRadius: 6,
                            pointBackgroundColor: '#e31a1c'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top', labels: { font: { size: 11 } } },
                        title: { display: true, text: 'Meeresspiegelanstieg (cm)', font: { size: 13 } }
                    },
                    scales: {
                        y: { title: { display: true, text: 'Anstieg (cm)' }, beginAtZero: true },
                        x: { title: { display: true, text: 'Jahr' } }
                    }
                }
            });
        }

        // === Layer mit Popups + Charts ===
        let slrLayer;
        let currentChart = null;

        function updateLayer(year, scenario) {
            if (slrLayer) map.removeLayer(slrLayer);
            if (currentChart) currentChart.destroy();

            slrLayer = new GeoJSON(slrZones, {
                style: (f) => ({
                    fillColor: getRisk(f.properties.rise[scenario][year]).color,
                    weight: 2, color: 'white', fillOpacity: 0.7
                }),
                onEachFeature: (feature, layer) => {
                    layer.bindPopup(() => {
                        const rise = feature.properties.rise[scenario][year];
                        const div = DomUtil.create('div', 'popup-content');
                        div.innerHTML = `
              <b>${feature.properties.area}</b><br>
              <small>Werte angelehnt an: ${feature.properties.source} (Beispielzone)</small><hr>
              <canvas id="slrChart"></canvas>
              <p style="font-size:12px; margin-top:8px;">
                <strong>${year}:</strong> ${rise} cm
                (${scenario === 'niedrig' ? 'SSP1-2.6' : 'SSP5-8.5'}),
                Risikostufe: <strong>${getRisk(rise).label}</strong>
              </p>
            `;

                        // Chart nach Popup-Öffnen erstellen
                        setTimeout(() => {
                            const ctx = div.querySelector('#slrChart').getContext('2d');
                            currentChart = createChart(ctx, feature.properties, scenario);
                        }, 100);

                        return div;
                    });
                }
            }).addTo(map);
        }

        updateLayer(2050, 'niedrig');

        // === Kontrollen ===
        const control = new Control({ position: 'topright' });
        control.onAdd = () => {
            const div = DomUtil.create('div', 'control');
            div.innerHTML = `
        <b>SLR-Szenario</b><br>
        <label>Jahr: 
          <select id="year">
            <option value="2050">2050</option>
            <option value="2100">2100</option>
          </select>
        </label>
        <label>Emission: 
          <select id="scenario">
            <option value="niedrig">Niedrig (SSP1-2.6)</option>
            <option value="hoch">Hoch (SSP5-8.5)</option>
          </select>
        </label>
      `;
            return div;
        };
        control.addTo(map);

        document.getElementById('year').addEventListener('change', (e) =>
            updateLayer(parseInt(e.target.value), document.getElementById('scenario').value));
        document.getElementById('scenario').addEventListener('change', (e) =>
            updateLayer(parseInt(document.getElementById('year').value), e.target.value));

        // === Legende ===
        const legend = new Control({ position: 'bottomright' });
        legend.onAdd = () => {
            const div = DomUtil.create('div', 'info legend');
            div.innerHTML = `
        <b>Risikostufe (cm)</b><br>
        <i style="background:#a6d96a"></i> Niedrig (&lt;20)<br>
        <i style="background:#fdae61"></i> Mittel (20–40)<br>
        <i style="background:#d7191c"></i> Hoch (&gt;40)
      `;
            return div;
        };
        legend.addTo(map);

        // === Titel ===
        const title = new Control({ position: 'topleft' });
        title.onAdd = () => {
            const div = DomUtil.create('div', 'info');
            div.innerHTML = '<h3>Meeresspiegelanstieg Mauritius<br><small>Klick auf Zone → Historischer Graph</small></h3><small>Beispieldaten: Zonen und Messreihe zur Illustration.<br>Quellen: <a href="https://www.ipcc.ch/report/ar6/wg1/" target="_blank">IPCC AR6</a>, <a href="https://sealevel.nasa.gov/data_tools/17" target="_blank">NASA Sea Level Projection Tool</a>, <a href="https://climateknowledgeportal.worldbank.org/country/mauritius" target="_blank">World Bank CCKP</a></small>';
            div.style.background = 'rgba(255,255,255,0.9)';
            div.style.padding = '10px';
            div.style.borderRadius = '5px';
            return div;
        };
        title.addTo(map);

    </script>
</body>
</html>
