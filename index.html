<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map of Mauritius</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <header class="site-header">
        <h1 class="sr-only">Map of Mauritius</h1>
        <a class="site-title" href="index.html">Leaflet Demo · Mauritius</a>
        <nav aria-label="Pages">
            <a href="index.html" aria-current="page">Map</a>
            <a href="pois.html">POIs</a>
            <a href="climate.html">Climate &amp; Sea Level</a>
            <a href="wind/wind.html">Wind &amp; Currents</a>
        </nav>
    </header>
    <main id="map" aria-label="Map of Mauritius"></main>
<script type="importmap">
    {
        "imports": {
            "leaflet": "./node_modules/leaflet/dist/leaflet.js"
        }
    }
</script>
<script type="module">
    import {Map, Control, TileLayer, LatLng, LatLngBounds} from 'leaflet';

    // Mauritius: the map shows the whole island and cannot be panned or zoomed out beyond it
    const bounds = new LatLngBounds(
        new LatLng(-20.575581867678267, 57.23327636718751),
        new LatLng(-19.95656892635273, 57.919235229492195)
    );

    const map = new Map('map', { maxBounds: bounds });
    map.fitBounds(bounds);
    map.setMinZoom(map.getZoom());

    const osm = new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    });

    const esri = new TileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });

    // Define baseLayers
    const baseLayers = {
      'OpenStreetMap': osm,
      'Esri': esri,
    };

    new Control.Layers(baseLayers).addTo(map);

    // Add default base layer
    baseLayers['OpenStreetMap'].addTo(map);
</script>
</body>
</html>
