<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Map Example</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        #map {
            flex: 1;
            width: 100%;
        }
        nav ul {
            margin: 0;
            padding: 5px 10px;
        }
        nav ul li {
            display: inline-block;
            padding: 5px;
        }
        nav ul li a{
            color: #0056b3;
        }
    </style>
</head>
<body>
<nav>
    <ul>
        <li><a href="climate.html">Climate &amp; Sea Level</a></li>
        <li><a href="pois.html">POI's</a></li>
        <li><a href="wind/wind.html">Wind</a></li>
    </ul>
</nav>
<div id="map"></div>
<script type="importmap">
    {
        "imports": {
            "leaflet": "./node_modules/leaflet/dist/leaflet.js"
        }
    }
</script>
<script type="module">
    import {Map, Control, TileLayer, LayerGroup, Marker, Popup, LatLng, LatLngBounds} from 'leaflet';

    // Initialize the map with a specific view
    const initialLat = -20.575581867678267; // Latitude for the center of the view
    const initialLon = 57.89588928222657;  // Longitude for the center of the view
    const initialZoom = 11;

    // Define the bounds using the provided coordinates
    const southWest = new LatLng(-20.575581867678267, 57.23327636718751);
    const northEast = new LatLng(-19.95656892635273, 57.919235229492195);
    const bounds = new LatLngBounds(southWest, northEast);

    // Initialize the map
    const map = new Map('map').setView([initialLat, initialLon], initialZoom); // Default view
    map.fitBounds(bounds);
    map.setMaxBounds(bounds);

    const osm = new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      minZoom: 11,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    });

    const stadia = new TileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.{ext}', {
      maxZoom: 19,
      minZoom: 11,
      attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      ext: 'png'
    });

    const esri = new TileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      minZoom: 11,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });

    // Define baseLayers
    const baseLayers = {
      'OpenStreetMap': osm,
      'Stadia': stadia,
      'Esri': esri,
    };

    const pharmacies = new LayerGroup();

    // Define overlays
    const overlays = {
      'Pharmacies': pharmacies,
    };

    new Control.Layers(baseLayers, overlays).addTo(map);

    // Add default base layer
    baseLayers['OpenStreetMap'].addTo(map);

    // Add default overlay
    overlays['Pharmacies'].addTo(map);

    // Function to load pharmacies from JSON
    async function loadPharmacies() {
        try {
            const response = await fetch('./data/mu_pharmacies.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            data.forEach(pharmacy => {
                const { Name_of_Pharmacy, Address, Contact_Number, Latitude, Longitude } = pharmacy;

                const popupContent = `<strong>${Name_of_Pharmacy}</strong><br>${Address}<br><br>📞 ${Contact_Number}`;

                const popup = new Popup({
                    maxWidth: 500, // Maximum width of the popup
                    minWidth: 200, // Minimum width of the popup
                    maxHeight: 400 // Maximum height of the popup (for scrollable content)
                }).setContent(popupContent);

                new Marker([Latitude, Longitude]).addTo(pharmacies).bindPopup(popup);
            });
        } catch (error) {
            console.error('Error loading pharmacies:', error);
        }
    }

    // Call the function to load pharmacies
    loadPharmacies();
</script>
</body>
</html>
