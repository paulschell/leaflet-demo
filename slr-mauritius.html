<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeresspiegelanstieg - Mauritius</title>
    <link rel="shortcut icon" href="#">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .legend,
        .info,
        .control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            line-height: 18px;
        }

        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
        }

        .control label,
        .control select {
            display: block;
            margin: 5px 0;
        }

        #year {
            width: 100px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="importmap">
        {
            "imports": {
                "leaflet": "./node_modules/leaflet/dist/leaflet.js"
            }
        }
    </script>
    <script type="module">
        import {Map, Control, DomUtil, TileLayer, GeoJSON} from 'leaflet';

        // Karte initialisieren (zentriert auf Mauritius)
        const map = new Map('map').setView([-20.2, 57.55], 10);

        // OpenStreetMap Tile Layer
        new TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // === SLR-BEISPIELDATEN ===
        // Zonen sind schematische Rechtecke. Die Werte orientieren sich an regionalen Projektionen
        // (IPCC AR6, NASA Sea Level Projection Tool, World Bank CCKP), sind aber nicht pro Ort belegt.
        // Prognosen: Niedrig (SSP1-2.6): ~16cm (2050), ~28cm (2100); Hoch (SSP5-8.5): ~24cm (2050), ~49cm (2100)
        const slrData = {
            type: 'FeatureCollection',
            features: [
                { type: 'Feature', properties: { risk: 'Hoch', area: 'Port Louis Hafen', rise_2050: 24, rise_2100: 49, source: 'World Bank/NASA' }, geometry: { type: 'Polygon', coordinates: [[[57.49, -20.15], [57.51, -20.15], [57.51, -20.17], [57.49, -20.17], [57.49, -20.15]]] } },
                { type: 'Feature', properties: { risk: 'Mittel', area: 'Grand Baie', rise_2050: 20, rise_2100: 40, source: 'MMS/IPCC' }, geometry: { type: 'Polygon', coordinates: [[[57.58, -20.00], [57.60, -20.00], [57.60, -20.02], [57.58, -20.02], [57.58, -20.00]]] } },
                { type: 'Feature', properties: { risk: 'Niedrig', area: 'Flic en Flac', rise_2050: 16, rise_2100: 28, source: 'World Bank' }, geometry: { type: 'Polygon', coordinates: [[[57.35, -20.28], [57.37, -20.28], [57.37, -20.30], [57.35, -20.30], [57.35, -20.28]]] } },
                { type: 'Feature', properties: { risk: 'Hoch', area: 'Blue Bay', rise_2050: 22, rise_2100: 45, source: 'MMS' }, geometry: { type: 'Polygon', coordinates: [[[57.72, -20.51], [57.74, -20.51], [57.74, -20.53], [57.72, -20.53], [57.72, -20.51]]] } }
            ]
        };

        // Farben für Risikostufen (dynamisch basierend auf Jahr und Szenario)
        function getColor(properties, year, scenario) {
            let rise = year === 2050 ? properties.rise_2050 : properties.rise_2100;
            if (scenario === 'hoch') rise *= 1.2; // Anpassung für hohes Szenario
            return rise < 20 ? '#a6d96a' : rise < 40 ? '#fdae61' : '#d7191c';
        }

        // Layer-Gruppe für SLR
        let slrLayer;
        function updateLayer(year, scenario) {
            if (slrLayer) map.removeLayer(slrLayer);
            slrLayer = new GeoJSON(slrData, {
                style: (feature) => ({
                    fillColor: getColor(feature.properties, year, scenario),
                    weight: 2, color: 'white', fillOpacity: 0.7
                }),
                onEachFeature: (feature, layer) => {
                    const rise = year === 2050 ? feature.properties.rise_2050 : feature.properties.rise_2100;
                    const adjRise = scenario === 'hoch' ? rise * 1.2 : rise;
                    layer.bindPopup(`
            <b>${feature.properties.area}</b><br>
            Prognostizierter Anstieg ${year}: <strong>${adjRise.toFixed(1)} cm</strong><br>
            Risikostufe: <strong>${feature.properties.risk}</strong><br>
            Werte angelehnt an: ${feature.properties.source} (Beispielzone)<br>
            <em>Historisch: ~3.8 mm/Jahr (Port Louis)</em>
          `);
                }
            });
            slrLayer.addTo(map);
        }

        // Initiales Update
        updateLayer(2050, 'niedrig');

        // === Kontrollpanel ===
        const control = new Control({ position: 'topright' });
        control.onAdd = function () {
            const div = DomUtil.create('div', 'control');
            div.innerHTML = `
        <b>SLR-Szenario</b><br>
        <label>Jahr: <select id="year"><option value="2050">2050</option><option value="2100">2100</option></select></label>
        <label>Emission: <select id="scenario"><option value="niedrig">Niedrig (SSP1-2.6)</option><option value="hoch">Hoch (SSP5-8.5)</option></select></label>
      `;
            return div;
        };
        control.addTo(map);

        // Event-Listener für Updates
        document.getElementById('year').addEventListener('change', (e) => updateLayer(parseInt(e.target.value), document.getElementById('scenario').value));
        document.getElementById('scenario').addEventListener('change', (e) => updateLayer(parseInt(document.getElementById('year').value), e.target.value));

        // === Legende ===
        const legend = new Control({ position: 'bottomright' });
        legend.onAdd = function () {
            const div = DomUtil.create('div', 'info legend');
            div.innerHTML = '<b>Risikostufe (SLR in cm)</b><br><i style="background:#a6d96a"></i> Niedrig (<20)<br><i style="background:#fdae61"></i> Mittel (20-40)<br><i style="background:#d7191c"></i> Hoch (>40)';
            return div;
        };
        legend.addTo(map);

        // Titel-Overlay
        const title = new Control({ position: 'topleft' });
        title.onAdd = function () {
            const div = DomUtil.create('div', 'info');
            div.innerHTML = '<h3>Meeresspiegelanstieg - Mauritius</h3><small>Beispieldaten: Zonen schematisch, Werte zur Illustration.<br>Quellen: <a href="https://www.ipcc.ch/report/ar6/wg1/" target="_blank">IPCC AR6</a>, <a href="https://sealevel.nasa.gov/data_tools/17" target="_blank">NASA Sea Level Projection Tool</a>, <a href="https://climateknowledgeportal.worldbank.org/country/mauritius" target="_blank">World Bank CCKP</a></small>';
            div.style.background = 'rgba(255,255,255,0.8)';
            div.style.padding = '10px';
            div.style.borderRadius = '5px';
            return div;
        };
        title.addTo(map);

    </script>
</body>

</html>
