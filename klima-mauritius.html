<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klima-Risiko Mauritius</title>
    <link rel="shortcut icon" href="#">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .legend,
        .info,
        .control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            line-height: 18px;
        }

        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
        }

        .control label,
        .control select {
            display: block;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>


    <script type="importmap">
        {
            "imports": {
                "leaflet": "./node_modules/leaflet/dist/leaflet.js"
            }
        }
    </script>
    <script type="module">
        import {Map, Control, DomUtil, TileLayer, GeoJSON} from 'leaflet';

        // Karte initialisieren (zentriert auf Mauritius)
        const map = new Map('map').setView([-20.2, 57.55], 10);

        // OpenStreetMap Tile Layer
        new TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // === KLIMA-RISIKO-DATEN (GeoJSON) ===
        // Beispieldaten: Zonen sind erfundene Rechtecke, die Risikostufen sind fiktiv
        const floodRisk = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "risk": "Hoch", "area": "Port Louis" }, "geometry": { "type": "Polygon", "coordinates": [[[57.49, -20.15], [57.51, -20.15], [57.51, -20.17], [57.49, -20.17], [57.49, -20.15]]] } },
                { "type": "Feature", "properties": { "risk": "Mittel", "area": "Beau Bassin" }, "geometry": { "type": "Polygon", "coordinates": [[[57.47, -20.22], [57.49, -20.22], [57.49, -20.24], [57.47, -20.24], [57.47, -20.22]]] } },
                { "type": "Feature", "properties": { "risk": "Niedrig", "area": "Curepipe" }, "geometry": { "type": "Polygon", "coordinates": [[[57.52, -20.31], [57.54, -20.31], [57.54, -20.33], [57.52, -20.33], [57.52, -20.31]]] } }
            ]
        };

        const droughtRisk = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "risk": "Hoch", "area": "Grand Port" }, "geometry": { "type": "Polygon", "coordinates": [[[57.70, -20.38], [57.73, -20.38], [57.73, -20.41], [57.70, -20.41], [57.70, -20.38]]] } },
                { "type": "Feature", "properties": { "risk": "Mittel", "area": "Flacq" }, "geometry": { "type": "Polygon", "coordinates": [[[57.71, -20.20], [57.74, -20.20], [57.74, -20.23], [57.71, -20.23], [57.71, -20.20]]] } }
            ]
        };

        const stormRisk = {
            "type": "FeatureCollection",
            "features": [
                { "type": "Feature", "properties": { "risk": "Hoch", "area": "Pamplemousses" }, "geometry": { "type": "Polygon", "coordinates": [[[57.50, -20.10], [57.53, -20.10], [57.53, -20.13], [57.50, -20.13], [57.50, -20.10]]] } },
                { "type": "Feature", "properties": { "risk": "Mittel", "area": "Rivière du Rempart" }, "geometry": { "type": "Polygon", "coordinates": [[[57.65, -20.07], [57.68, -20.07], [57.68, -20.10], [57.65, -20.10], [57.65, -20.07]]] } }
            ]
        };

        // Farben für Risikostufen
        function getColor(risk) {
            return risk === 'Hoch' ? '#d7191c' :
                risk === 'Mittel' ? '#fdae61' :
                    '#a6d96a';
        }

        // Layer-Gruppen
        const floodLayer = new GeoJSON(floodRisk, {
            style: (feature) => ({ fillColor: getColor(feature.properties.risk), weight: 2, color: 'white', fillOpacity: 0.7 }),
            onEachFeature: (feature, layer) => {
                layer.bindPopup(`<b>${feature.properties.area}</b><br>Überflutungsrisiko: <strong>${feature.properties.risk}</strong>`);
            }
        });

        const droughtLayer = new GeoJSON(droughtRisk, {
            style: (feature) => ({ fillColor: getColor(feature.properties.risk), weight: 2, color: 'white', fillOpacity: 0.7 }),
            onEachFeature: (feature, layer) => {
                layer.bindPopup(`<b>${feature.properties.area}</b><br>Dürre-Risiko: <strong>${feature.properties.risk}</strong>`);
            }
        });

        const stormLayer = new GeoJSON(stormRisk, {
            style: (feature) => ({ fillColor: getColor(feature.properties.risk), weight: 2, color: 'white', fillOpacity: 0.7 }),
            onEachFeature: (feature, layer) => {
                layer.bindPopup(`<b>${feature.properties.area}</b><br>Sturmrisiko: <strong>${feature.properties.risk}</strong>`);
            }
        });

        // Risiko-Layer je Radio-Button-Wert
        const riskLayers = { flood: floodLayer, drought: droughtLayer, storm: stormLayer };

        // Layer hinzufügen (standardmäßig Überflutung)
        let activeLayer = floodLayer.addTo(map);

        // === Kontrollpanel ===
        const control = new Control({ position: 'topright' });
        control.onAdd = function () {
            const div = DomUtil.create('div', 'control');
            div.innerHTML = `
        <b>Klima-Risiko</b><br>
        <label><input type="radio" name="risk" value="flood" checked> Überflutung</label>
        <label><input type="radio" name="risk" value="drought"> Dürre</label>
        <label><input type="radio" name="risk" value="storm"> Sturm</label>
      `;
            return div;
        };
        control.addTo(map);

        // Radio-Button-Logik
        document.querySelectorAll('input[name="risk"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                map.removeLayer(activeLayer);
                activeLayer = riskLayers[e.target.value].addTo(map);
            });
        });

        // === Legende ===
        const legend = new Control({ position: 'bottomright' });
        legend.onAdd = function () {
            const div = DomUtil.create('div', 'info legend');
            const grades = ['Niedrig', 'Mittel', 'Hoch'];
            const colors = ['#a6d96a', '#fdae61', '#d7191c'];
            div.innerHTML = '<b>Risikostufe</b><br>';
            for (let i = 0; i < grades.length; i++) {
                div.innerHTML += `<i style="background:${colors[i]}"></i> ${grades[i]}<br>`;
            }
            return div;
        };
        legend.addTo(map);

        // Titel-Overlay
        const title = new Control({ position: 'topleft' });
        title.onAdd = function () {
            const div = DomUtil.create('div', 'info');
            div.innerHTML = '<h3>Klima-Risiko-Modell Mauritius</h3><small>Beispieldaten: Zonen und Risikostufen sind fiktiv</small>';
            div.style.background = 'rgba(255,255,255,0.8)';
            div.style.padding = '10px';
            div.style.borderRadius = '5px';
            return div;
        };
        title.addTo(map);

    </script>
</body>
</html>
